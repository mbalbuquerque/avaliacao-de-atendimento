name: Deploy na Azure

# A cada push na main: testa e publica no App Service, depois confere o /health.
# A publicação só roda quando o segredo AZURE_WEBAPP_PUBLISH_PROFILE existe. Sem ele, o job
# "Publicar no App Service" aparece como IGNORADO (cinza) e o resumo do workflow explica o
# motivo: nunca fica verde sem ter publicado nada.
# Como cadastrar o segredo: docs/implantacao-azure.md, seção "Deploy automático".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

# Nome e endereço do app vêm de variáveis do repositório (Settings > Secrets and variables >
# Actions > Variables): AZURE_WEBAPP_NAME e APP_URL. Sem elas valem os padrões abaixo.
env:
  APP_NOME: ${{ vars.AZURE_WEBAPP_NAME || 'app-cloud-g01-en' }}
  APP_URL: ${{ vars.APP_URL || format('https://{0}.azurewebsites.net', vars.AZURE_WEBAPP_NAME || 'app-cloud-g01-en') }}

jobs:
  testar:
    name: Testar antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:cobertura

  segredo:
    name: Verificar o segredo de publicação
    runs-on: ubuntu-latest
    outputs:
      disponivel: ${{ steps.verificar.outputs.disponivel }}
    steps:
      - name: Conferir se AZURE_WEBAPP_PUBLISH_PROFILE existe
        id: verificar
        env:
          PERFIL: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PERFIL" ]; then
            echo "disponivel=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy automático IGNORADO"
              echo
              echo "O segredo \`AZURE_WEBAPP_PUBLISH_PROFILE\` não está cadastrado neste repositório,"
              echo "então **nada foi publicado**. Os testes rodaram e passaram."
              echo "Como habilitar: \`docs/implantacao-azure.md\`, seção \"Deploy automático\"."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "disponivel=true" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    name: Publicar no App Service
    needs: [testar, segredo]
    if: needs.segredo.outputs.disponivel == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Empacotar o código (sem testes nem node_modules)
        run: git archive --format=zip -o app.zip HEAD

      - name: Publicar
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NOME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

      - name: Conferir o /health publicado
        run: |
          for tentativa in $(seq 1 20); do
            resposta=$(curl -s -m 20 "$APP_URL/health" || true)
            if echo "$resposta" | grep -q '"database":"connected"'; then
              echo "Saudável: $resposta"
              exit 0
            fi
            echo "Tentativa $tentativa: $resposta"
            sleep 15
          done
          echo "O /health não confirmou o banco conectado depois do deploy."
          exit 1
