name: CodeQL

# Análise estática de segurança do código JavaScript (servidor e front-end).
# Roda em push na main, em pull request e toda segunda-feira.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  analisar:
    name: Análise CodeQL (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
