<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">

  <title>Login do gestor | Avalie o Atendimento</title>

  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <main class="pagina-central">
    <section class="cartao-central" aria-labelledby="titulo-login">
      <a class="voltar" href="index.html">← Voltar ao início</a>

      <div class="brand">
        <span class="brand-marca" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
        </span>
        <span class="brand-nome">Avalie o Atendimento<small>Área do gestor</small></span>
      </div>

      <span class="etiqueta">Área restrita</span>
      <h1 id="titulo-login">Entrar para moderar</h1>
      <p>Use as credenciais do gestor para ocultar ou reexibir comentários.</p>

      <form id="loginForm" method="post" action="/api/admin/login" novalidate>
        <div class="campo">
          <label for="username">Usuário</label>
          <input id="username" name="username" type="text" autocomplete="username"
            autocapitalize="none" spellcheck="false" required>
        </div>

        <div class="campo">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <p id="loginMessage" class="login-mensagem" role="alert"></p>

        <button id="loginButton" class="btn btn-primaria btn-bloco" type="submit">Entrar no painel</button>
      </form>

      <p class="rodape-login">Acesso exclusivo aos gestores autorizados.</p>
    </section>
  </main>

  <script src="js/config.js" defer></script>
  <script src="js/admin-login.js" defer></script>
</body>
</html>
