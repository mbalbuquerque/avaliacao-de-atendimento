
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#035680">
  <title>Sem conexão | Avalie o Atendimento</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #F4F8FB;
      color: #3D3D3D;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    main {
      max-width: 420px;
      padding: 36px 26px;
      border: 1px solid #DDE9F1;
      border-radius: 22px;
      background: white;
    }
    .symbol {
      font-size: 55px;
      color: #0482C2;
    }
    h1 { color: #035680; }
    p { line-height: 1.7; }
    button {
      background: #0482C2;
      color: white;
      border: 0;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="symbol">★</div>
    <h1>Você está offline</h1>
    <p>
      Não foi possível carregar esta página.
      Conecte-se à internet para enviar avaliações
      e consultar resultados atualizados.
    </p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
